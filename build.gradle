buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath 'io.github.gradle-nexus:publish-plugin:1.3.0'
    }
}

apply plugin: 'groovy'
apply plugin: 'idea'
apply plugin: 'io.github.gradle-nexus.publish-plugin'
apply from: "${rootDir}/publish-root.gradle"

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation "commons-configuration:commons-configuration:1.10"
    // AGP 9 is the floor: the plugin reads variants through `androidComponents.onVariants`,
    // which replaced the applicationVariants/libraryVariants DSL collections AGP 9 removed.
    compileOnly 'com.android.tools.build:gradle:9.3.2'
}

java {
    withSourcesJar()
    withJavadocJar()
}

ext {
    // Provide your own coordinates here
    PUBLISH_GROUP_ID = 'com.readdle.android.swift'
    PUBLISH_ARTIFACT_ID = 'gradle'
    PUBLISH_VERSION = '6.2.2'
}

apply from: "${rootProject.projectDir}/publish-module.gradle"
